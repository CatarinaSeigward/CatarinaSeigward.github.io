{{ define "main" }}
<section class="wrap pg-head not-found" data-animate="intro">
  <span class="badge badge-secondary">404</span>
  <h1 class="display sm">Page not found</h1>
  <p class="lead pg-lead">This page has moved, or never existed.</p>
  <a class="btn btn-outline" href="{{ site.Home.RelPermalink }}">{{ partial "icon.html" (dict "name" "arrow-left" "class" "icon-prev") }} Back home</a>
</section>
{{ end }}
