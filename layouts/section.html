{{ define "main" }}
<section class="wrap pg-head" data-animate="intro">
  <h1 class="display sm">{{ .Title }}</h1>
  {{- with .Content }}
  <div class="lead pg-lead">{{ . }}</div>
  {{- end }}
</section>
<section class="wrap section">
  <div class="card list-card" data-animate="stagger">
    {{- range .RegularPages.ByDate.Reverse }}
    {{ partial "list-item.html" (dict "page" . "level" 2 "desc" true) }}
    {{- end }}
  </div>
</section>
{{ end }}
